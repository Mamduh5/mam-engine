<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mam-engine editor</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="app-header">
    <div><strong>mam-engine</strong><span class="phase-label">read-only editor</span></div>
    <dl class="workspace-status">
      <div><dt>Workspace</dt><dd id="workspace-name">Loading…</dd></div>
      <div><dt>Connection</dt><dd id="connection-status" data-state="pending">Connecting</dd></div>
      <div><dt>Definitions</dt><dd><span id="valid-count">0</span> valid · <span id="invalid-count">0</span> invalid</dd></div>
    </dl>
  </header>
  <div class="editor-layout">
    <aside class="definition-sidebar" aria-label="Definition browser">
      <label class="search-label" for="definition-search">Search definitions</label>
      <input id="definition-search" type="search" placeholder="Name, ID, or path" autocomplete="off">
      <fieldset id="kind-filters"><legend>Definition kinds</legend></fieldset>
      <nav aria-label="Definitions"><div id="definition-list" class="definition-list"><p class="muted">Loading definitions…</p></div></nav>
    </aside>
    <main id="inspector" tabindex="-1">
      <section class="empty-state" id="inspector-state">
        <p class="eyebrow">Inspector</p>
        <h1>No definition selected</h1>
        <p>Select a supported definition to inspect authored fields, references, and validation findings.</p>
      </section>
    </main>
  </div>
  <script src="/client.js" defer></script>
</body>
</html>
